services:
  postgres:
    image: postgres:16
    container_name: cit-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: cit_platform
      POSTGRES_USER: cit_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - cit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cit_app -d cit_platform"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cit_postgres_data:
